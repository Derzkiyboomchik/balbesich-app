<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Посещаемость | balbesich.ru</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>
  <div class="app-container" id="app-body">
    <!-- Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="group-title">
          <span class="group-badge">ГРУППА</span>
          <span class="group-name" id="group-title-text">Загрузка...</span>
        </div>
        <div class="updated-time" id="update-time-text"></div>
      </div>
      <!-- Subject Tabs -->
      <div class="tabs-scroll" id="subject-tabs">
        <button class="tab-btn active">Сводная ведомость</button>
      </div>
    </header>

    <!-- Toolbar / Legend -->
    <div class="bar-tools">
      <div class="legend">
        <div class="legend-item"><span class="legend-dot danger"></span> Неуважительно</div>
        <div class="legend-item"><span class="legend-dot warn"></span> Уважительно</div>
      </div>
      <div style="font-size: 10px;">← свайп по датам →</div>
    </div>

    <!-- Table content -->
    <div class="table-wrapper" id="table-container">
      <div class="state-box">
        <div class="spinner"></div>
        <p style="color: var(--text-muted); font-size: 13px;">Загрузка ведомости...</p>
      </div>
    </div>
  </div>

  <script src="app.js?v=1.1"></script>
</body>
</html>
